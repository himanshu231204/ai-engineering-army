name: Validate and package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Set up Node for OpenCode adapter contract tests
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate skills, docs, and fixtures
        run: python tools/aiea.py validate
      - name: Test distribution contracts
        run: python -m unittest discover -s tests -v
      - name: Prepare release assets
        run: python tools/aiea.py release --output dist/release
      - name: Retain downloadable release assets
        uses: actions/upload-artifact@v7
        with:
          name: aiea-${{ matrix.os }}-python-${{ matrix.python }}
          path: dist/release/*
          if-no-files-found: error
