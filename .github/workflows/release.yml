name: Release

# Pushing a version tag publishes a GitHub release with every package asset,
# so the Releases section always shows the current version.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (for example v1.2.1)"
        required: true
        type: string
      prerelease:
        description: "Mark the release as a prerelease"
        required: false
        default: true
        type: boolean
      draft:
        description: "Create a draft for review instead of publishing"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release settings
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_PRERELEASE: ${{ inputs.prerelease }}
          DISPATCH_DRAFT: ${{ inputs.draft }}
        run: |
          set -eo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$DISPATCH_TAG"
            prerelease="$DISPATCH_PRERELEASE"
            draft="$DISPATCH_DRAFT"
          else
            tag="$REF_NAME"
            prerelease="true"
            draft="false"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (prerelease=$prerelease, draft=$draft)"

      - name: Check out the tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.tag }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify the tag matches VERSION
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag="${TAG#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::VERSION is $version but the tag is $TAG"
            exit 1
          fi
          echo "VERSION $version matches tag $TAG"

      - name: Validate skills, docs, and fixtures
        run: python tools/aiea.py validate

      - name: Test distribution contracts
        run: python -m unittest discover -s tests -v

      - name: Build the release bundle
        run: python tools/aiea.py release --output dist/release

      - name: Verify bundle checksums
        working-directory: dist/release
        run: sha256sum --check SHA256SUMS

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
          PRERELEASE: ${{ steps.resolve.outputs.prerelease }}
          DRAFT: ${{ steps.resolve.outputs.draft }}
        run: |
          set -eo pipefail
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          if [ "$DRAFT" = "true" ]; then flags+=(--draft); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing its assets."
            gh release upload "$TAG" dist/release/* --clobber
          else
            gh release create "$TAG" dist/release/* \
              --title "AIEA ${TAG#v}" \
              --notes-file dist/release/RELEASE-NOTES.md \
              ${flags[@]+"${flags[@]}"}
          fi
